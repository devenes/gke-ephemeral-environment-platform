apiVersion: platform.gke.io/v1alpha1
kind: PreviewEnvironment
metadata:
  name: pr-101
spec:
  environmentName: pr-101
  developer: devenes
  prNumber: 101
  repository: devenes/gke-ephemeral-environment-platform
  commitSHA: "130a6c8"
  image: us-west4-docker.pkg.dev/enes-turan-demo/gke-ephemeral-env/sample-app:v0.1.0
  ttlSeconds: 86400
  replicas: 1
  port: 8080
  resources:
    cpuRequest: 50m
    cpuLimit: 200m
    memoryRequest: 64Mi
    memoryLimit: 128Mi
  env:
    - name: FEATURE_CHECKOUT_V2
      value: "enabled"
    - name: LOG_LEVEL
      value: "info"
