apiVersion: v1
kind: Namespace
metadata:
  name: preview-platform-system
  labels:
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-controller
  namespace: preview-platform-system
  labels:
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-controller-role
  labels:
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
rules:
  - apiGroups: ["platform.gke.io"]
    resources: ["previewenvironments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["platform.gke.io"]
    resources: ["previewenvironments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["platform.gke.io"]
    resources: ["previewenvironments/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["namespaces", "services", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.gke.io"]
    resources: ["servicenetworkendpointgroups"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-controller-rolebinding
  labels:
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-controller-role
subjects:
  - kind: ServiceAccount
    name: preview-controller
    namespace: preview-platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-github-actions-role
  labels:
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
rules:
  - apiGroups: ["platform.gke.io"]
    resources: ["previewenvironments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["platform.gke.io"]
    resources: ["previewenvironments/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-github-actions-rolebinding
  labels:
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-github-actions-role
subjects:
  - kind: User
    name: gke-ephemeral-gh-actions@your-gcp-project-id.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: preview-shared-gateway
  namespace: preview-platform-system
  labels:
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform.gke.io/managed-by: preview-controller
---
apiVersion: v1
kind: Service
metadata:
  name: preview-controller-metrics
  namespace: preview-platform-system
  labels:
    app.kubernetes.io/name: preview-controller
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
spec:
  selector:
    app.kubernetes.io/name: preview-controller
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-controller
  namespace: preview-platform-system
  labels:
    app.kubernetes.io/name: preview-controller
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preview-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview-controller
        app.kubernetes.io/part-of: gke-ephemeral-environment-platform
    spec:
      serviceAccountName: preview-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: us-west4-docker.pkg.dev/your-gcp-project-id/gke-ephemeral-env/preview-controller:v0.1.0
          imagePullPolicy: Always
          args:
            - "--metrics-bind-address=:8080"
            - "--health-probe-bind-address=:8081"
            - "--gateway-name=preview-shared-gateway"
            - "--gateway-namespace=preview-platform-system"
            - "--proxy-subnet-cidr=10.42.16.0/23"
            - "--allowed-image-prefixes=us-west4-docker.pkg.dev/your-gcp-project-id/gke-ephemeral-env/"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
