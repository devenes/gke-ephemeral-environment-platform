apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: previewenvironments.platform.gke.io
  labels:
    app.kubernetes.io/part-of: gke-ephemeral-environment-platform
spec:
  group: platform.gke.io
  scope: Cluster
  names:
    plural: previewenvironments
    singular: previewenvironment
    kind: PreviewEnvironment
    shortNames:
      - pe
      - preview
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Namespace
          type: string
          jsonPath: .status.namespace
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: URL
          type: string
          jsonPath: .status.previewURL
        - name: ExpiresAt
          type: string
          jsonPath: .status.expiresAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "size(self.metadata.name) <= 40"
              message: "metadata.name must be 40 characters or fewer so derived preview-<name> identifiers stay within DNS-1035 limits"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - image
              properties:
                environmentName:
                  type: string
                  maxLength: 40
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                developer:
                  type: string
                  default: "devenes"
                  maxLength: 63
                prNumber:
                  type: integer
                  minimum: 0
                  maximum: 999999
                repository:
                  type: string
                  default: "devenes/gke-ephemeral-environment-platform"
                  maxLength: 128
                commitSHA:
                  type: string
                  maxLength: 64
                image:
                  type: string
                  minLength: 1
                  maxLength: 512
                ttlSeconds:
                  type: integer
                  default: 3600
                  minimum: 30
                  maximum: 86400
                replicas:
                  type: integer
                  default: 1
                  minimum: 1
                  maximum: 3
                port:
                  type: integer
                  default: 8080
                  minimum: 1024
                  maximum: 65535
                pathPrefix:
                  type: string
                  maxLength: 64
                resources:
                  type: object
                  properties:
                    cpuRequest:
                      type: string
                      default: "50m"
                    cpuLimit:
                      type: string
                      default: "200m"
                    memoryRequest:
                      type: string
                      default: "64Mi"
                    memoryLimit:
                      type: string
                      default: "128Mi"
                env:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required:
                      - name
                      - value
                    properties:
                      name:
                        type: string
                        pattern: "^[A-Z_][A-Z0-9_]{0,63}$"
                      value:
                        type: string
                        maxLength: 1024
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                namespace:
                  type: string
                deploymentName:
                  type: string
                serviceName:
                  type: string
                httpRouteName:
                  type: string
                previewURL:
                  type: string
                readyReplicas:
                  type: integer
                createdAt:
                  type: string
                  format: date-time
                readyAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                cleanupStatus:
                  type: string
                conditions:
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
